# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# You'll be asked for the values marked `sync: false` (database credentials, admin password, URLs).
# PostgreSQL: use a free Neon database (doesn't expire) — see docs/DEPLOYMENT.md.
services:
  - type: web
    name: payflow-api
    runtime: docker
    region: singapore
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: false            # GitHub Actions deploys only after tests pass (deploy hook)
    envVars:
      - key: DB_URL              # jdbc:postgresql://<neon-host>/<db>?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true      # random 256-bit secret generated by Render
      - key: ADMIN_EMAIL
        value: admin@payflow.dev
      - key: ADMIN_PASSWORD      # 12+ characters, letters and numbers
        sync: false
      - key: CORS_ORIGINS        # the payflow-web URL, e.g. https://payflow-web.onrender.com
        sync: false
      - key: DEMO_MODE           # creates demo accounts shown on the sign-in page
        value: "true"
      - key: OTP_SANDBOX_SHOW_CODE   # show OTPs on screen (no email/SMS provider needed)
        value: "true"

  - type: web
    name: payflow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite            # single-page app: /pay/<token> etc. are handled by React
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL        # the payflow-api URL, e.g. https://payflow-api.onrender.com
        sync: false
